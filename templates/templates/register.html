{% extends "base.html" %}

{% block title %}Register | Connect{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Create Your Account</h1>
    <p>Join Connect and meet new people.</p>

    <form action="{{ url_for('register') }}" method="POST">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" required minlength="3" maxlength="30">

        <label for="email">Email Address</label>
        <input id="email" type="email" name="email" required>

        <label for="password">Password</label>
        <input id="password" type="password" name="password" required minlength="8">

        <button type="submit">Create Account</button>
    </form>

    <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
